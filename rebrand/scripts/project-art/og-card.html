<!doctype html>
<!-- The picture shown when a page of the site is shared and has no image of
     its own (1200 x 630). Rendered to public/og-card.png by render.cjs. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2') format('woff2');
    font-weight: 300 700;
  }
  @font-face {
    font-family: 'Montserrat';
    src: url('../../node_modules/@fontsource-variable/montserrat/files/montserrat-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #07050c;
  }

  body {
    position: relative;
    font-family: 'Montserrat', sans-serif;
    color: #f3f0fa;
  }

  /* Glow + faint grid, as on the project art */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(55% 75% at 92% 8%, rgba(124, 58, 237, 0.45), transparent 70%),
      radial-gradient(45% 65% at 6% 100%, rgba(76, 29, 149, 0.4), transparent 70%),
      repeating-linear-gradient(0deg, rgba(167, 139, 250, 0.055) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(90deg, rgba(167, 139, 250, 0.055) 0 1px, transparent 1px 48px);
  }

  /* Link previews are cropped differently by each app, so everything stays
     well inside the edges. */
  .wrap {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 80px;
  }

  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .wordmark span { color: #a78bfa; }

  h1 {
    margin: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 88px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.03em;
  }

  h1 b {
    font-weight: 700;
    background: linear-gradient(120deg, #c4b5fd 0%, #a78bfa 40%, #7c3aed 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .who {
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 500;
    color: #d8d2e5;
  }

  .who::before {
    content: '';
    width: 48px;
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(120deg, #c4b5fd, #7c3aed);
  }

  .who i {
    font-style: normal;
    color: #6f6884;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="wordmark">cz<span>.</span>catzzz</div>
    <h1>Clean. Analyze.<br />Visualize. <b>Automate.</b></h1>
    <div class="who">CZ Catalan <i>/</i> Data Analyst <i>/</i> Python, SQL, dashboards</div>
  </div>
</body>
</html>
