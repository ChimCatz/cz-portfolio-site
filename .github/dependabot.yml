# Opens a pull request once a month when a dependency has an update, and
# sooner for a security fix. Updates of one kind arrive as a single pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /rebrand
    schedule:
      interval: monthly
    groups:
      site:
        patterns: ['*']
    # A new major version (e.g. the next Astro) can need code changes, so
    # those are done by hand, not proposed automatically.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # The contact form Worker: security fixes only. Cap's API changes between
  # releases, so other upgrades are done by hand (worker/README.md).
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
