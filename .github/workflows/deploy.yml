# Builds the Astro site in rebrand/ and publishes it to GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab.
#
# Needs the repo setting: Settings > Pages > Build and deployment >
# Source: "GitHub Actions". With "Deploy from a branch" the repo root would be
# published instead, and the root no longer has an index.html.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebrand
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rebrand/package-lock.json

      # Nothing is published if the repo holds a secret or a stray file
      - name: Check for secrets and stray files
        working-directory: .
        run: node .github/scripts/repo-check.mjs

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: rebrand/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
